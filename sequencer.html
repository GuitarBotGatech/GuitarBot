<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuitarBot Sequencer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0f;--surface:#131318;--surface2:#1a1a22;--surface3:#22222e;
  --border:#28283a;--text:#e0e0f0;--text-dim:#565680;--text-muted:#2a2a44;
  --amber:#f59e0b;--amber-d:#7a5008;
  --teal:#14b8a6;--teal-d:#0a5c56;
  --purple:#a855f7;--purple-d:#5a1fa0;
  --cyan:#22d3ee;--red:#f43f5e;--green:#10b981;--yellow:#fbbf24;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:13px;overflow:hidden;user-select:none}

/* ── TOOLBAR ── */
#toolbar{height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 10px;flex-shrink:0;overflow-x:auto}
#toolbar::-webkit-scrollbar{height:0}
.logo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--amber);letter-spacing:-1px;white-space:nowrap;margin-right:4px}
.logo em{color:var(--text-dim);font-style:normal;font-weight:300}
.sep{width:1px;height:26px;background:var(--border);margin:0 2px;flex-shrink:0}
.tg{display:flex;align-items:center;gap:5px;flex-shrink:0}
.tl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);white-space:nowrap}
input[type=text],input[type=number],select{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:3px;padding:3px 7px;font-family:'JetBrains Mono',monospace;font-size:11px;
  outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--amber)}
input[type=number]{width:58px;text-align:center}
#song-name{width:150px}
select{cursor:pointer;background-image:none}
.tbtn{height:26px;min-width:26px;border-radius:3px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:13px;padding:0 6px;transition:all .1s;font-family:'JetBrains Mono',monospace}
.tbtn:hover{background:var(--surface3);color:var(--text)}
.tbtn.play{border-color:var(--green);color:var(--green)}
.tbtn.play.on{background:var(--green);color:#000}
.tbtn.stop{border-color:var(--red);color:var(--red)}
.tbtn.act{border-color:var(--amber);color:var(--amber)}
.tbtn.act:hover{background:var(--amber);color:#000}
.tbtn.pen{border-color:var(--cyan);color:var(--cyan)}
.tbtn.pen.on{background:var(--cyan);color:#000}
.tbtn.snap{border-color:var(--purple);color:var(--purple)}
.tbtn.snap.on{background:var(--purple);color:#000}
.tbtn.cycle{border-color:var(--purple);color:var(--purple)}
.tbtn.cycle.on{background:var(--purple);color:#000}
.pos-disp{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--cyan);min-width:44px;text-align:center}
.tr{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh}
#main{flex:1;display:flex;overflow:hidden;position:relative}
#seq{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#roll-wrap{flex:1;overflow-x:hidden;overflow-y:auto;position:relative;cursor:default}
canvas{display:block}

/* ── INSPECTOR ── */
#insp{
  width:232px;min-width:232px;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .2s ease;
  position:absolute;right:0;top:0;bottom:0;z-index:20;
}
#insp.open{transform:translateX(0)}
.ih{padding:12px 14px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.it{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim)}
.ix{width:20px;height:20px;border:none;background:none;color:var(--text-dim);cursor:pointer;font-size:17px;border-radius:3px;transition:all .1s;display:flex;align-items:center;justify-content:center}
.ix:hover{background:var(--surface2);color:var(--text)}
.ib{padding:14px;flex:1;overflow-y:auto}
.if{margin-bottom:14px}
.il{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
.note-big{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;letter-spacing:-1px}
.note-sub{font-size:11px;color:var(--text-dim);margin-top:1px}
.sc{display:flex;align-items:center;gap:7px}
input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:var(--surface3);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--amber);border-radius:50%;cursor:pointer;transition:transform .1s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
.sv{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--amber);min-width:28px;text-align:right}
.tog{position:relative;width:34px;height:18px;cursor:pointer;flex-shrink:0}
.tog input{display:none}
.tog-t{position:absolute;inset:0;background:var(--surface3);border-radius:9px;border:1px solid var(--border);transition:all .2s}
.tog input:checked+.tog-t{background:var(--teal);border-color:var(--teal)}
.tog-k{position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--text-dim);border-radius:50%;transition:all .2s}
.tog input:checked~.tog-k{left:18px;background:#fff}
.tog-row{display:flex;align-items:center;gap:8px}
.tog-lbl{font-size:12px}
.trem{
  display:none;align-items:center;gap:6px;
  background:linear-gradient(135deg,#2a1060,#0e2060);
  border:1px solid var(--purple);border-radius:4px;
  padding:5px 9px;margin-bottom:10px;
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;color:var(--purple)
}
.trem.on{display:flex}
.trem svg path{animation:tw .35s infinite alternate}
@keyframes tw{from{d:path("M1 7 Q3 4 5 7 Q7 10 9 7 Q11 4 13 7")}to{d:path("M1 7 Q3 10 5 7 Q7 4 9 7 Q11 10 13 7")}}
.dur-in{width:75px}
.del-btn{
  width:100%;padding:7px;background:transparent;border:1px solid var(--red);
  color:var(--red);border-radius:3px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;margin-top:6px;transition:all .1s
}
.del-btn:hover{background:var(--red);color:#fff}
.insp-sep{height:1px;background:var(--border);margin:10px 0}

/* ── JSON PANEL ── */
#jp-bar{
  height:30px;background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;cursor:pointer;flex-shrink:0
}
#jp-bar:hover{background:var(--surface2)}
#jp-lbl{color:var(--text-dim);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
#jp-chev{margin-left:auto;color:var(--text-dim);font-size:9px;transition:transform .2s}

/* ── GRID CONTROL ── */
#grid-ctrl{
  position:absolute;bottom:12px;right:14px;
  display:flex;align-items:center;gap:5px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:5px;padding:5px 9px;z-index:10;
  box-shadow:0 4px 14px rgba(0,0,0,.5)
}
#grid-ctrl-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-right:3px}
.gcbtn{
  width:21px;height:21px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text-dim);border-radius:3px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:all .12s;
  line-height:1;padding:0;font-family:'JetBrains Mono',monospace
}
.gcbtn:hover:not(:disabled){border-color:var(--purple);color:var(--purple);background:var(--surface3)}
.gcbtn:disabled{opacity:.25;cursor:default}
#grid-label{
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
  color:var(--purple);min-width:48px;text-align:center;letter-spacing:-0.3px
}
#jp{background:var(--surface);max-height:0;overflow:hidden;transition:max-height .3s ease}
#jp.open{max-height:180px}
#jp-content{height:180px;overflow-y:auto;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.55;color:#8888b0;white-space:pre}
.jk{color:#7eb3f7}.js{color:#98d4a0}.jn{color:#f4a261}.jb{color:#e36397}

/* ── POPUPS ── */
.popup{
  position:fixed;background:var(--surface2);border:1px solid var(--border);
  border-radius:5px;padding:10px;z-index:50;display:none;min-width:190px;
  box-shadow:0 10px 30px rgba(0,0,0,.7)
}
.popup.on{display:block}
.ph{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between}
.pc{cursor:pointer}
.pr{margin-bottom:8px}
.pl{font-size:10px;color:var(--text-dim);margin-bottom:3px}
.popup select,.popup input{width:100%}
.pdel{display:block;width:100%;margin-top:8px;padding:4px 8px;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:3px;cursor:pointer;font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;transition:all .1s}
.pdel:hover{background:var(--red);color:#fff}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
#hidden-file{display:none}
</style>
</head>
<body>
<div id="app">

<!-- TOOLBAR -->
<div id="toolbar">
  <div class="logo">GUITAR<em>BOT</em></div>
  <div class="sep"></div>
  <div class="tg"><input type="text" id="song-name" value="Untitled Song" placeholder="Song name…"></div>
  <div class="sep"></div>
  <div class="tg"><span class="tl">BPM</span><input type="number" id="bpm" value="120" min="20" max="300" step="0.5"></div>
  <div class="sep"></div>
  <div class="tg">
    <span class="tl">Key</span>
    <select id="key-root">
      <option>C</option><option>C#</option><option>D</option><option>D#</option>
      <option value="E" selected>E</option><option>F</option><option>F#</option>
      <option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option>
    </select>
    <select id="key-mode"><option value="minor" selected>min</option><option value="major">maj</option></select>
  </div>
  <div class="sep"></div>
  <div class="tg">
    <span class="tl">Sig</span>
    <select id="time-sig">
      <option value="4/4" selected>4/4</option><option value="3/4">3/4</option>
      <option value="6/8">6/8</option><option value="2/4">2/4</option><option value="5/4">5/4</option>
    </select>
  </div>
  <div class="sep"></div>
  <div class="tg"><span class="tl">Bars</span><input type="number" id="measures" value="8" min="1" max="64"></div>
  <div class="sep"></div>
  <div class="tg">
    <button class="tbtn stop" id="btn-stop" title="Stop">■</button>
    <button class="tbtn play" id="btn-play" title="Play">▶</button>
    <div class="pos-disp" id="pos">1.1</div>
  </div>
  <div class="sep"></div>
  <div class="tg">
    <button class="tbtn cycle" id="btn-cycle" title="Cycle bar (off)">CYCLE</button>
    <span class="tl">Bars</span>
    <input type="number" id="cycle-start" value="1" min="1" max="64" step="1" style="width:48px;text-align:center">
    <span class="tl">→</span>
    <input type="number" id="cycle-end" value="2" min="1" max="64" step="1" style="width:48px;text-align:center">
  </div>
  <div class="sep"></div>
  <div class="tg">
    <button class="tbtn pen on" id="btn-mode-draw" title="Draw mode (pen on)">✎</button>
    <button class="tbtn snap on" id="btn-snap" title="Snap to grid (on)">SNAP</button>
  </div>
  <div class="sep"></div>
  <div class="tg">
    <button class="tbtn" id="zoom-out" title="Zoom out">−</button>
    <button class="tbtn" id="zoom-in" title="Zoom in">+</button>
  </div>
  <div class="tr">
    <button class="tbtn act" id="btn-upload">⇪ Upload to Bot</button>
    <button class="tbtn stop" id="btn-reset-bot">↺ Reset Bot</button>
    <button class="tbtn" id="btn-import">↑ Import</button>
    <button class="tbtn act" id="btn-export">↓ Export</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="seq">
    <div id="roll-wrap">
      <canvas id="roll"></canvas>
      <div id="grid-ctrl">
        <span id="grid-ctrl-lbl">GRID</span>
        <button class="gcbtn" id="grid-prev" title="Finer grid">‹</button>
        <span id="grid-label">1/16</span>
        <button class="gcbtn" id="grid-next" title="Coarser grid">›</button>
      </div>
    </div>
    <div id="jp-bar" onclick="toggleJP()">
      <span id="jp-chev">▲</span>
      <span id="jp-lbl">JSON Preview</span>
    </div>
    <div id="jp"><div id="jp-content"></div></div>
  </div>

  <!-- INSPECTOR -->
  <div id="insp">
    <div class="ih">
      <span class="it">Note Inspector</span>
      <button class="ix" onclick="closeInsp()">×</button>
    </div>
    <div class="ib">
      <div class="if">
        <div class="note-big" id="i-note">E3</div>
        <div class="note-sub">MIDI <span id="i-midi">52</span> · <span id="i-str">String 2</span></div>
      </div>
      <div class="trem" id="i-trem">
        <svg width="14" height="10" viewBox="0 0 14 10"><path d="M1 5 Q3 2 5 5 Q7 8 9 5 Q11 2 13 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        TREMOLO
      </div>
      <div class="if">
        <div class="il">Speed <span class="sv" id="i-sv">6</span></div>
        <div class="sc">
          <input type="range" id="i-speed" min="1" max="10" step="1" value="6" oninput="updSpeed(this.value)">
        </div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim);margin-top:3px"><span>slow</span><span>fast</span></div>
      </div>
      <div class="if">
        <div class="il">Slide</div>
        <div class="tog-row">
          <label class="tog"><input type="checkbox" id="i-slide" onchange="updSlide(this.checked)"><div class="tog-t"></div><div class="tog-k"></div></label>
          <span class="tog-lbl" id="i-slide-lbl">Off</span>
        </div>
      </div>
      <div class="if">
        <div class="il">Duration (beats)</div>
        <input type="number" class="dur-in" id="i-dur" min="0.0625" max="16" step="0.0625" value="0.5" oninput="updDur(this.value)">
      </div>
      <div class="insp-sep"></div>
      <div class="if">
        <div class="il">String Override</div>
        <select id="i-str-ov" onchange="updStrOv(this.value)" style="width:100%">
          <option value="">Auto (by note)</option>
          <option value="0">0 — Low E</option>
          <option value="1">1 — D</option>
          <option value="2">2 — B</option>
        </select>
      </div>
      <button class="del-btn" onclick="delSelNote()">Delete Note</button>
    </div>
  </div>
</div>

</div>

<!-- CHORD POPUP -->
<div class="popup" id="cpop">
  <div class="ph">Chord Event <span class="pc" onclick="closeCPop()">×</span></div>
  <div class="pr"><div class="pl">Chord Symbol</div>
    <select id="cp-chord" onchange="updChord('chord',this.value)" style="width:100%">
      <option>Em</option><option>Am</option><option>Dm</option><option>Bm</option>
      <option>C</option><option>G</option><option>D</option><option>A</option>
      <option>E</option><option>F</option><option>Fm</option><option>Gm</option>
      <option>B</option><option>Eb</option><option>Ab</option><option>On</option>
    </select>
  </div>
  <div class="pr"><div class="pl">Beat Position</div>
    <input type="text" id="cp-beat" onchange="updChord('beat',this.value)" style="width:100%">
  </div>
  <button class="pdel" onclick="delChord()">Delete</button>
</div>

<!-- MIDI POPUP -->
<div class="popup" id="mpop">
  <div class="ph">MIDI FX Event <span class="pc" onclick="closeMPop()">×</span></div>
  <div class="pr"><div class="pl">OSC Address</div>
    <select id="mp-addr" onchange="updMidi('address',this.value)" style="width:100%">
      <option value="/cc">/cc — Control Change</option>
      <option value="/note">/note — Note On</option>
      <option value="/noteoff">/noteoff — Note Off</option>
      <option value="/program">/program — Program Change</option>
      <option value="/pitch">/pitch — Pitch Bend</option>
    </select>
  </div>
  <div class="pr"><div class="pl">Args (comma-separated)</div>
    <input type="text" id="mp-args" onchange="updMidi('args',this.value)" placeholder="7, 64" style="width:100%">
  </div>
  <div class="pr"><div class="pl">Interpolate</div>
    <div class="tog-row" style="margin-top:4px">
      <label class="tog"><input type="checkbox" id="mp-interp" onchange="updMidi('interp',this.checked?1:0)"><div class="tog-t"></div><div class="tog-k"></div></label>
      <span style="font-size:11px;color:var(--text-dim)">Smooth ramp</span>
    </div>
  </div>
  <button class="pdel" onclick="delMidi()">Delete</button>
</div>

<input type="file" id="hidden-file" accept=".json">

<script>
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const MIDI_MIN=40, MIDI_MAX=68, NOTE_COUNT=29;
const noteH_DEFAULT=14, noteH_MIN=6, noteH_MAX=50;
let noteH=noteH_DEFAULT;
const LABEL_W=54, CHORD_H=30;
const MIDI_GENERAL_LANE_H=24;
const MIDI_AUTOMATION_LANE_H=30;
const MIDI_AUTOMATION_CCS=[1,2,3,4,7];
const MIDI_LANE_COUNT=1+MIDI_AUTOMATION_CCS.length;
const MIDI_AUTOMATION_TOTAL_H=MIDI_AUTOMATION_CCS.length*MIDI_AUTOMATION_LANE_H;
const MIDI_GENERAL_LANE_INDEX=MIDI_AUTOMATION_CCS.length;
const MIDI_H=MIDI_AUTOMATION_TOTAL_H+MIDI_GENERAL_LANE_H;
const rollH=()=>NOTE_COUNT*noteH;
const canvasH=()=>CHORD_H+rollH()+MIDI_H;
const SUBDIV=4; // used by formatBeat/parseBeat for 3-part display only
const GRID_STEPS=[
  {label:'1/16t',beats:1/6},
  {label:'1/16', beats:1/4},
  {label:'1/8t', beats:1/3},
  {label:'1/8',  beats:1/2},
  {label:'1/4t', beats:2/3},
  {label:'1/4',  beats:1  },
  {label:'1/2t', beats:4/3},
  {label:'1/2',  beats:2  },
  {label:'1',    beats:4  },
];
const SPEED_MIN=1, SPEED_MAX=10, SPEED_DEFAULT=6;
const IMPORT_KEY='guitarbot_startup_import_json';

const STRINGS=[
  {min:40,max:49,name:"String 1",color:"#f59e0b",dim:"#3b200566"},
  {min:50,max:58,name:"String 2",color:"#14b8a6",dim:"#0a3b3666"},
  {min:59,max:68,name:"String 3",color:"#a855f7",dim:"#3b107866"},
];

const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteName=m=>NOTE_NAMES[m%12]+(Math.floor(m/12)-1);
const strOf=m=>STRINGS.find(s=>m>=s.min&&m<=s.max)||STRINGS[0];
const createEmptyMidiCurves=()=>Object.fromEntries(MIDI_AUTOMATION_CCS.map(cc=>[String(cc),[]]));

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let S={
  songName:"Untitled Song", bpm:120, keyRoot:"E", keyMode:"minor",
  timeSig:"4/4", measures:8,
  pluck:[], chord:[], midi:[],
  midiCurves:createEmptyMidiCurves(),
  nextId:1, zoom:80, scrollX:0,
  playing:false, playBeat:0,
  cycleEnabled:false,
  cycleStartBar:1,
  cycleEndBar:2,
  editMode:'select',
  snapEnabled:true,
  gridIdx:1,
  selPluckIds:new Set(),
  clipboardPluck:null,
  pasteAnchor:null,
  focusedCCLane:null,
  selPluck:null, selChord:null, selMidi:null,
};

const bpm=()=>{const[n]=S.timeSig.split('/').map(Number);return n};
const totalBeats=()=>S.measures*bpm();
const beatToX=b=>LABEL_W+b*S.zoom-S.scrollX;
const xToBeat=x=>(x-LABEL_W+S.scrollX)/S.zoom;
const noteToY=n=>CHORD_H+(MIDI_MAX-n)*noteH;
const yToNote=y=>MIDI_MAX-Math.floor((y-CHORD_H)/noteH);
const midiTopY=()=>CHORD_H+rollH();
const hasFocusedCCLane=()=>Number.isInteger(S.focusedCCLane)&&S.focusedCCLane>=0&&S.focusedCCLane<MIDI_AUTOMATION_CCS.length;
const midiLaneVisible=index=>!hasFocusedCCLane()||index===S.focusedCCLane;
const midiLaneTop=index=>{
  if(hasFocusedCCLane())return midiTopY();
  return index===MIDI_GENERAL_LANE_INDEX?midiTopY()+MIDI_AUTOMATION_TOTAL_H:midiTopY()+(index*MIDI_AUTOMATION_LANE_H);
};
const midiLaneHeight=index=>{
  if(!midiLaneVisible(index))return 0;
  if(hasFocusedCCLane())return MIDI_H;
  return index===MIDI_GENERAL_LANE_INDEX?MIDI_GENERAL_LANE_H:MIDI_AUTOMATION_LANE_H;
};
function midiLaneAtY(cy){
  const rel=cy-midiTopY();
  if(rel<0||rel>=MIDI_H)return-1;
  if(hasFocusedCCLane())return S.focusedCCLane;
  if(rel<MIDI_AUTOMATION_TOTAL_H)return Math.min(MIDI_AUTOMATION_CCS.length-1,Math.floor(rel/MIDI_AUTOMATION_LANE_H));
  return MIDI_GENERAL_LANE_INDEX;
}
const midiValueFromY=(cy,lane)=>Math.round((1-clamp((cy-midiLaneTop(lane))/Math.max(1,midiLaneHeight(lane)),0,1))*127);
const midiYFromValue=(value,lane)=>midiLaneTop(lane)+(1-clamp((parseFloat(value)||0)/127,0,1))*midiLaneHeight(lane);
const laneForCC=cc=>{
  const index=MIDI_AUTOMATION_CCS.indexOf(parseInt(cc,10));
  return index>=0?index:-1;
};
const gridStep=()=>GRID_STEPS[S.gridIdx].beats;
const snap=b=>{const gs=gridStep();return Math.round(b/gs)*gs;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const trimBeatNumber=v=>parseFloat(Number(v).toFixed(4));
const normalizeBeat=b=>S.snapEnabled?snap(b):trimBeatNumber(b);
const minDurationBeats=()=>S.snapEnabled?gridStep():0.02;
const noteDurationSeconds=ev=>ev.duration_b*(60/Math.max(1,S.bpm));
const secondsPerBeat=()=>{
  const parts=String(S.timeSig||'4/4').split('/');
  const denominator=parseFloat(parts[1]);
  const beatUnit=Number.isFinite(denominator)&&denominator>0?denominator:4;
  return (60/Math.max(1,S.bpm))*(4/beatUnit);
};
const secondsToBeat=t=>trimBeatNumber(Math.max(0,parseFloat(t)||0)/secondsPerBeat());
const secondsToDurationBeats=t=>Math.max(0.02,trimBeatNumber((parseFloat(t)||0)/secondsPerBeat()));
const beatsToSeconds=b=>Math.max(0,parseFloat(b)||0)*secondsPerBeat();
const hasTremolo=ev=>noteDurationSeconds(ev)>0.5;
const clampSpeed=v=>clamp(parseInt(v)||SPEED_DEFAULT,SPEED_MIN,SPEED_MAX);
const speedToVelocity=s=>Math.round(((clampSpeed(s)-SPEED_MIN)/(SPEED_MAX-SPEED_MIN))*127);
function normalizeImportedSpeed(raw){
  const n=parseFloat(raw);
  if(!Number.isFinite(n))return SPEED_DEFAULT;
  if(n>SPEED_MAX){
    const scaled=Math.round((n/127)*(SPEED_MAX-SPEED_MIN)+SPEED_MIN);
    return clampSpeed(scaled);
  }
  return clampSpeed(n);
}

function beatLabel(b){
  const normalized=Math.max(0,trimBeatNumber(b));
  const m=bpm();
  const bar=Math.floor(normalized/m)+1;
  const inBar=normalized-((bar-1)*m);
  const beatWhole=Math.floor(inBar)+1;
  const frac=inBar-Math.floor(inBar);
  const subFloat=frac*SUBDIV;
  const subRounded=Math.round(subFloat);
  const isGrid=Math.abs(subFloat-subRounded)<1e-4;
  if(isGrid){
    return `${bar}.${beatWhole}.${subRounded+1}`;
  }
  // Non-SUBDIV position (e.g. triplets): store as raw beat with sentinel
  // to avoid dot-collision in parseBeat (e.g. "1.1.1667" misread as 3-part)
  return `~${trimBeatNumber(normalized)}`;
}
function parseBeat(s){
  if(!s)return 0;
  const str=String(s);
  if(str.startsWith('~'))return parseFloat(str.slice(1))||0;
  const p=str.split('.');
  const bar=parseInt(p[0])||1;
  if(p.length>=3){
    const beat=parseInt(p[1])||1;
    const sub=parseInt(p[2])||1;
    return (bar-1)*bpm()+(beat-1)+(sub-1)/SUBDIV;
  }
  const beat=parseFloat(p[1])||1;
  return (bar-1)*bpm()+(beat-1);
}

function getCycleRange(){
  if(!S.cycleEnabled)return null;
  const m=bpm();
  const startBar=clamp(parseInt(S.cycleStartBar)||1,1,S.measures);
  const endBar=clamp(parseInt(S.cycleEndBar)||startBar,startBar,S.measures);
  const startBeat=(startBar-1)*m;
  const endBeat=endBar*m;
  if(endBeat<=startBeat)return null;
  return {startBar,endBar,startBeat,endBeat};
}

function syncCycleControls(){
  const maxBars=Math.max(1,S.measures);
  S.cycleStartBar=clamp(parseInt(S.cycleStartBar)||1,1,maxBars);
  S.cycleEndBar=clamp(parseInt(S.cycleEndBar)||S.cycleStartBar,S.cycleStartBar,maxBars);

  const btn=document.getElementById('btn-cycle');
  const inStart=document.getElementById('cycle-start');
  const inEnd=document.getElementById('cycle-end');
  if(!btn||!inStart||!inEnd)return;

  btn.classList.toggle('on',S.cycleEnabled);
  btn.title=S.cycleEnabled?'Cycle bar (on)':'Cycle bar (off)';
  inStart.disabled=!S.cycleEnabled;
  inEnd.disabled=!S.cycleEnabled;
  inStart.max=maxBars;
  inEnd.max=maxBars;
  inStart.value=S.cycleStartBar;
  inEnd.value=S.cycleEndBar;
}

const canvas=document.getElementById('roll');
const ctx=canvas.getContext('2d');
let CW=0;

function resize(){
  CW=document.getElementById('roll-wrap').clientWidth;
  canvas.width=CW; canvas.height=canvasH();
  render();
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render(){
  if(!ctx)return;
  ctx.clearRect(0,0,CW,canvasH());
  drawBG(); drawGrid(); drawLabels();
  drawCycleBar(); drawChordLane(); drawMidiLane(); drawSlideLinks(); drawNotes(); drawPlayhead(); drawSelectionBox();
}

function eventStringIndex(ev){
  if(ev&&ev.string_index!==null&&ev.string_index!==undefined){
    const explicit=parseInt(ev.string_index,10);
    if(Number.isFinite(explicit)&&explicit>=0&&explicit<STRINGS.length)return explicit;
  }
  const inferred=STRINGS.findIndex(s=>ev.note>=s.min&&ev.note<=s.max);
  return inferred>=0?inferred:0;
}

function normalizeMidiCurvePoints(points){
  const sorted=[...points].sort((a,b)=>a.beat-b.beat);
  const deduped=[];
  for(const point of sorted){
    const beat=trimBeatNumber(Math.max(0,parseFloat(point.beat)||0));
    const value=clamp(Math.round(parseFloat(point.value)||0),0,127);
    if(deduped.length&&Math.abs(deduped[deduped.length-1].beat-beat)<1e-4){
      deduped[deduped.length-1]={beat,value};
    }else{
      deduped.push({beat,value});
    }
  }
  return deduped;
}

function upsertMidiCurvePoint(cc,beat,value){
  const key=String(cc);
  const targetBeat=trimBeatNumber(Math.max(0,beat));
  const targetValue=clamp(Math.round(value),0,127);
  const points=S.midiCurves[key]||[];

  const filtered=points.filter(point=>{
    const pointBeat=trimBeatNumber(Math.max(0,parseFloat(point.beat)||0));
    if(!S.snapEnabled)return Math.abs(pointBeat-targetBeat)>1e-4;
    return Math.abs(snap(pointBeat)-targetBeat)>1e-4;
  });
  filtered.push({beat:targetBeat,value:targetValue});
  S.midiCurves[key]=normalizeMidiCurvePoints(filtered);
}

function clearMidiCurveRange(cc,startBeat,endBeat){
  const key=String(cc);
  const lo=Math.min(startBeat,endBeat);
  const hi=Math.max(startBeat,endBeat);
  const eps=1e-4;
  const points=S.midiCurves[key]||[];
  S.midiCurves[key]=points.filter(point=>{
    const pointBeat=trimBeatNumber(Math.max(0,parseFloat(point.beat)||0));
    return !(pointBeat>lo+eps&&pointBeat<hi-eps);
  });
}

function midiAutomationEvents(){
  const events=[];
  const interpDefault=1;
  for(const cc of MIDI_AUTOMATION_CCS){
    const points=normalizeMidiCurvePoints(S.midiCurves[String(cc)]||[]);
    points.forEach((point,index)=>{
      events.push({
        address:'/cc',
        args:[cc,point.value],
        interp:index<points.length-1?interpDefault:0,
        beat:beatLabel(point.beat),
      });
    });
  }
  return events;
}

function drawSlideLinks(){
  const byString=[[],[],[]];
  for(const ev of S.pluck){
    byString[eventStringIndex(ev)].push(ev);
  }

  for(const events of byString){
    events.sort((a,b)=>parseBeat(a.beat)-parseBeat(b.beat)||a.id-b.id);
    for(let index=0;index<events.length-1;index++){
      const from=events[index];
      if(!from.slide)continue;
      const to=events[index+1];

      const fromBeat=parseBeat(from.beat);
      const toBeat=parseBeat(to.beat);
      const fromX=beatToX(fromBeat)+Math.max(8,from.duration_b*S.zoom);
      const toX=beatToX(toBeat);
      const fromY=noteToY(from.note)+(noteH/2);
      const toY=noteToY(to.note)+(noteH/2);

      if(toX<LABEL_W||fromX>CW)continue;

      const color=strOf(from.note).color;
      ctx.strokeStyle=color;
      ctx.lineWidth=1.3;
      ctx.globalAlpha=0.85;
      ctx.beginPath();
      ctx.moveTo(fromX,fromY);
      ctx.lineTo(toX,toY);
      ctx.stroke();

      const angle=Math.atan2(toY-fromY,toX-fromX);
      const head=5;
      ctx.beginPath();
      ctx.moveTo(toX,toY);
      ctx.lineTo(toX-head*Math.cos(angle-Math.PI/6),toY-head*Math.sin(angle-Math.PI/6));
      ctx.lineTo(toX-head*Math.cos(angle+Math.PI/6),toY-head*Math.sin(angle+Math.PI/6));
      ctx.closePath();
      ctx.fillStyle=color;
      ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}

function drawCycleBar(){
  const range=getCycleRange();
  if(!range)return;
  const x1=Math.max(LABEL_W,beatToX(range.startBeat));
  const x2=Math.min(CW,beatToX(range.endBeat));
  if(x2<=x1)return;

  ctx.fillStyle='rgba(168,85,247,0.14)';
  ctx.fillRect(x1,0,x2-x1,canvasH());
  ctx.fillStyle='rgba(168,85,247,0.2)';
  ctx.fillRect(x1,0,x2-x1,CHORD_H);
  ctx.strokeStyle='#a855f7';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x1,0); ctx.lineTo(x1,canvasH()); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,0); ctx.lineTo(x2,canvasH()); ctx.stroke();
}

function drawBG(){
  // Chord lane
  ctx.fillStyle='#10101a'; ctx.fillRect(0,0,CW,CHORD_H);
  // Roll rows
  for(let n=MIDI_MIN;n<=MIDI_MAX;n++){
    const y=noteToY(n), s=strOf(n), isSharp=[1,3,6,8,10].includes(n%12);
    ctx.fillStyle=isSharp?'#08080e':s.dim; ctx.fillRect(LABEL_W,y,CW-LABEL_W,noteH);
    ctx.fillStyle='#14141e'; ctx.fillRect(LABEL_W,y+noteH-1,CW-LABEL_W,1);
  }
  // MIDI lane
  const my=midiTopY();
  for(let lane=0;lane<MIDI_LANE_COUNT;lane++){
    if(!midiLaneVisible(lane))continue;
    const top=midiLaneTop(lane);
    const height=midiLaneHeight(lane);
    ctx.fillStyle=lane===0?'#0c0c14':(lane%2===0?'#0a0a12':'#0d0d16');
    ctx.fillRect(LABEL_W,top,CW-LABEL_W,height);
  }
  // Label column
  ctx.fillStyle='#0e0e16';
  ctx.fillRect(0,0,LABEL_W,canvasH());
  ctx.fillStyle='#161622'; ctx.fillRect(0,0,LABEL_W,CHORD_H);
  ctx.fillRect(0,my,LABEL_W,MIDI_H);
  // Lane labels
  ctx.fillStyle='#383860'; ctx.font='500 9px "JetBrains Mono"'; ctx.textAlign='center';
  ctx.fillText('CHD',LABEL_W/2,CHORD_H/2+3);
  for(let lane=0;lane<MIDI_LANE_COUNT;lane++){
    if(!midiLaneVisible(lane))continue;
    const top=midiLaneTop(lane);
    const h=midiLaneHeight(lane);
    const label=lane===MIDI_GENERAL_LANE_INDEX?'FX':`CC${MIDI_AUTOMATION_CCS[lane]}`;
    ctx.fillText(label,LABEL_W/2,top+h/2+3);
  }
}

function drawGrid(){
  const tb=totalBeats(), m=bpm();
  const gs=gridStep(), eps=gs*0.05;
  for(let b=0; b<=tb+eps; b+=gs){
    const br=parseFloat(b.toFixed(9));
    const x=beatToX(br);
    if(x<LABEL_W-1||x>CW+1)continue;
    const remM=br%m, isMeasure=remM<eps||(m-remM)<eps;
    const remB=br%1,  isBeat=remB<eps||(1-remB)<eps;
    ctx.strokeStyle=isMeasure?'#323250':isBeat?'#1e1e34':'#141428';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvasH()); ctx.stroke();
    if(isMeasure){
      const bar=Math.round(br/m)+1;
      ctx.fillStyle='#323250'; ctx.font='500 9px "JetBrains Mono"';
      ctx.textAlign='left'; ctx.fillText(bar,x+3,CHORD_H-5);
    }
  }
  // Zone separators
  ctx.strokeStyle='#232340'; ctx.lineWidth=1;
  [[0,CHORD_H],[0,CHORD_H+rollH()]].forEach(([,y])=>{
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke();
  });
  for(let lane=0;lane<MIDI_LANE_COUNT;lane++){
    if(!midiLaneVisible(lane))continue;
    const y=midiLaneTop(lane);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(0,midiTopY()+MIDI_H); ctx.lineTo(CW,midiTopY()+MIDI_H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(LABEL_W,0); ctx.lineTo(LABEL_W,canvasH()); ctx.stroke();
}

function drawLabels(){
  ctx.textAlign='right';
  for(let n=MIDI_MIN;n<=MIDI_MAX;n++){
    const y=noteToY(n), isC=(n%12)===0, isSharp=[1,3,6,8,10].includes(n%12);
    ctx.fillStyle=isC?'#5858a0':isSharp?'#1e1e38':'#303058';
    ctx.font=(isC?'600':'400')+' 9px "JetBrains Mono"';
    ctx.fillText(noteName(n),LABEL_W-4,y+noteH/2+3);
  }
  // String range indicators
  STRINGS.forEach(s=>{
    const y1=noteToY(s.max), y2=noteToY(s.min)+noteH;
    ctx.fillStyle=s.color+'44'; ctx.fillRect(2,y1,3,y2-y1);
  });
}

function drawChordLane(){
  state.chord.forEach(ev=>{
    const x=beatToX(parseBeat(ev.beat));
    if(x<LABEL_W-60||x>CW+20)return;
    const sel=ev.id===S.selChord;
    const col=sel?'#fbbf24':'#8a760e';
    // Stem
    ctx.fillStyle=col; ctx.fillRect(x-1,4,2,CHORD_H-8);
    // Flag box
    const fw=Math.max(36,ev.chord.length*8+10);
    ctx.fillStyle=sel?'#fbbf2418':'#8a760e18';
    ctx.fillRect(x,4,fw,CHORD_H-10);
    ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.strokeRect(x,4,fw,CHORD_H-10);
    ctx.fillStyle=col; ctx.font='600 10px "JetBrains Mono"';
    ctx.textAlign='left'; ctx.fillText(ev.chord,x+5,CHORD_H-9);
  });
}

function drawMidiLane(){
  if(midiLaneVisible(MIDI_GENERAL_LANE_INDEX)){
  const cy=midiLaneTop(MIDI_GENERAL_LANE_INDEX)+midiLaneHeight(MIDI_GENERAL_LANE_INDEX)/2;
  S.midi.forEach(ev=>{
    const x=beatToX(parseBeat(ev.beat));
    if(x<LABEL_W-20||x>CW+20)return;
    const sel=ev.id===S.selMidi;
    const col=sel?'#22d3ee':'#0e7a8c';
    const sz=sel?8:6;
    ctx.beginPath();
    ctx.moveTo(x,cy-sz); ctx.lineTo(x+sz,cy);
    ctx.lineTo(x,cy+sz); ctx.lineTo(x-sz,cy);
    ctx.closePath();
    ctx.fillStyle=col+(sel?'':'88'); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=col; ctx.font='500 9px "JetBrains Mono"';
    ctx.textAlign='left'; ctx.fillText(ev.address,x+sz+3,cy+3);
  });
  }

  for(const cc of MIDI_AUTOMATION_CCS){
    const lane=laneForCC(cc);
    const points=[...(S.midiCurves[String(cc)]||[])].sort((a,b)=>a.beat-b.beat);
    if(!points.length)continue;

    const color=cc===7?'#22d3ee':'#a855f7';
    ctx.strokeStyle=color;
    ctx.lineWidth=1.8;
    ctx.globalAlpha=0.9;
    ctx.beginPath();
    points.forEach((point,index)=>{
      const x=beatToX(point.beat);
      const y=midiYFromValue(point.value,lane);
      if(index===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.globalAlpha=1;

    for(const point of points){
      const x=beatToX(point.beat);
      const y=midiYFromValue(point.value,lane);
      if(x<LABEL_W-4||x>CW+4)continue;
      ctx.beginPath();
      ctx.arc(x,y,2.7,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.fill();
      ctx.strokeStyle='#0b0b0f';
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }
}

function drawNotes(){
  S.pluck.forEach(ev=>{
    const b=parseBeat(ev.beat), x=beatToX(b);
    const y=noteToY(ev.note);
    const w=Math.max(8,ev.duration_b*S.zoom);
    if(x+w<LABEL_W||x>CW)return;
    const sel=ev.id===S.selPluck||S.selPluckIds.has(ev.id);
    const s=strOf(ev.note);
    const isTrem=hasTremolo(ev);
    const cx2=Math.max(LABEL_W,x), cw2=Math.min(CW,x+w)-cx2;
    if(cw2<=0)return;

    ctx.save();
    ctx.beginPath(); ctx.rect(cx2,y+1,cw2,noteH-2); ctx.clip();

    // Body
    ctx.fillStyle=s.color+(sel?'ee':'bb');
    ctx.fillRect(x,y+1,w,noteH-2);

    // Slide stripes
    if(ev.slide){
      ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1;
      for(let sx=x-noteH;sx<x+w+noteH;sx+=5){
        ctx.beginPath(); ctx.moveTo(sx,y+1); ctx.lineTo(sx+noteH-2,y+noteH-1); ctx.stroke();
      }
    }
    // Tremolo wave
    if(isTrem){
      ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1.5;
      const my2=y+noteH/2;
      ctx.beginPath();
      for(let tx=x;tx<x+w;tx+=2){
        const wy=my2+Math.sin((tx-x)*1.2)*2.2;
        tx===x?ctx.moveTo(tx,wy):ctx.lineTo(tx,wy);
      }
      ctx.stroke();
    }
    ctx.restore();

    // Border
    ctx.strokeStyle=sel?'#fff':s.color;
    ctx.lineWidth=sel?1.5:0.8;
    if(sel){ctx.shadowBlur=10;ctx.shadowColor=s.color}
    ctx.strokeRect(cx2,y+1,cw2,noteH-2);
    ctx.shadowBlur=0;

    // Resize handle
    const hx=Math.min(CW-4,x+w-4);
    if(hx>=LABEL_W){
      ctx.fillStyle='rgba(255,255,255,0.45)';
      ctx.fillRect(hx,y+2,3,noteH-4);
    }
  });
}

function drawSelectionBox(){
  if(!drag||drag.type!=='select-box')return;
  const x=Math.min(drag.sx,drag.cx), y=Math.min(drag.sy,drag.cy);
  const w=Math.abs(drag.cx-drag.sx), h=Math.abs(drag.cy-drag.sy);
  ctx.save();
  ctx.setLineDash([4,3]);
  ctx.fillStyle='rgba(34,211,238,0.14)';
  ctx.strokeStyle='#22d3ee';
  ctx.lineWidth=1;
  ctx.fillRect(x,y,w,h);
  ctx.strokeRect(x,y,w,h);
  ctx.restore();
}

function drawPlayhead(){
  if(!S.playing&&S.playBeat===0)return;
  const x=beatToX(S.playBeat);
  if(x<LABEL_W||x>CW)return;
  ctx.strokeStyle='#f43f5e'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvasH()); ctx.stroke();
  ctx.fillStyle='#f43f5e';
  ctx.beginPath(); ctx.moveTo(x-5,0); ctx.lineTo(x+5,0); ctx.lineTo(x,8); ctx.closePath(); ctx.fill();
}

let drag=null;

canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const hit=hitPluck(e.clientX-r.left,e.clientY-r.top);
  if(hit){rmPluck(hit.id);closeInsp();render();syncJSON()}
});

canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  canvas.setPointerCapture(e.pointerId);
  const r=canvas.getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  closeCPop(); closeMPop();
  const myY=CHORD_H+rollH();

  if(cy<CHORD_H){chordDown(cx,cy,e);return}
  if(cy>=myY){midiDown(cx,cy,e);return}

  // Vertical zoom drag on label column
  if(cx<LABEL_W){
    drag={type:'vzoom',sy:e.clientY,startNoteH:noteH};
    return;
  }

  if(S.editMode==='draw'){
    const hit=hitPluck(cx,cy);
    if(hit){
      const bx=beatToX(parseBeat(hit.beat)), hw=Math.max(8,hit.duration_b*S.zoom);
      const isResizeR=cx>=bx+hw-6&&cx<=bx+hw+3;
      const isResizeL=cx>=bx-3&&cx<=bx+6;
      if(isResizeL||isResizeR){
        drag={type:'resize',id:hit.id,sx:cx,edge:isResizeL?'left':'right',os:parseBeat(hit.beat),oe:parseBeat(hit.beat)+hit.duration_b};
      } else {
        drag={type:'drag',id:hit.id,sx:cx,sy:cy,
          ob:parseBeat(hit.beat),on:hit.note,
          bo:parseBeat(hit.beat)-xToBeat(cx),
          no:hit.note-yToNote(cy)};
      }
      selPluck(hit.id);
    } else if(cx>=LABEL_W){
      const b=normalizeBeat(Math.max(0,xToBeat(cx)));
      const n=clamp(yToNote(cy),MIDI_MIN,MIDI_MAX);
      if(b<totalBeats())addNote(b,n);
      deselectAll();
    }
  } else {
    if(cx<LABEL_W)return;
    const clickedBeat=normalizeBeat(Math.max(0,xToBeat(cx)));
    const clickedNote=clamp(yToNote(cy),MIDI_MIN,MIDI_MAX);
    S.pasteAnchor={
      beat:clickedBeat,
      note:clickedNote,
    };
    const hit=hitPluck(cx,cy);
    if(hit){
      const start=parseBeat(hit.beat);
      const end=start+hit.duration_b;
      const x1=beatToX(start), x2=beatToX(end);
      const isResizeL=Math.abs(cx-x1)<=6;
      const isResizeR=Math.abs(cx-x2)<=6;
      if(isResizeL||isResizeR){
        drag={type:'resize',id:hit.id,sx:cx,edge:isResizeL?'left':'right',os:start,oe:end};
        selPluck(hit.id);
      } else {
        const selectedIds=S.selPluckIds.size?[...S.selPluckIds]:[];
        const shouldDragGroup=selectedIds.length>1&&S.selPluckIds.has(hit.id);
        if(!shouldDragGroup){
          selPluck(hit.id);
        }
        const ids=shouldDragGroup?selectedIds:[hit.id];
        const noteOffsets=ids.map(id=>{
          const ev=S.pluck.find(p=>p.id===id);
          return ev?{id,noteOffset:ev.note-clickedNote}:{id,noteOffset:0};
        });
        drag={
          type:'drag-group',
          ids,
          sxBeat:xToBeat(cx),
          syNote:clickedNote,
          startById:new Map(ids.map(id=>{
            const ev=S.pluck.find(p=>p.id===id);
            return [id,ev?{beat:parseBeat(ev.beat),note:ev.note}:{beat:0,note:clickedNote}];
          })),
          noteOffsets,
        };
      }
    } else {
      drag={type:'select-box',sx:cx,sy:cy,cx,cy,hitId:null,moved:false,clickBeat:clickedBeat};
    }
  }
  render();
});

canvas.addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  if(!drag){
    updateHoverCursor(cx,cy);
    return;
  }
  if(drag.type==='midi-curve'){
    const beat=normalizeBeat(clamp(xToBeat(cx),0,totalBeats()));
    const value=midiValueFromY(cy,drag.lane);
    if(S.snapEnabled&&typeof drag.lastBeat==='number'&&Math.abs(beat-drag.lastBeat)>1e-4){
      clearMidiCurveRange(drag.cc,drag.lastBeat,beat);
    }
    upsertMidiCurvePoint(drag.cc,beat,value);
    drag.lastBeat=beat;
    render();
    return;
  }
  if(drag.type==='cycle-move'){
    const m=bpm();
    const deltaBeats=xToBeat(cx)-drag.startBeat;
    const deltaBars=Math.round(deltaBeats/m);
    const spanBars=drag.endBar-drag.startBar+1;
    let newStart=drag.startBar+deltaBars;
    newStart=clamp(newStart,1,Math.max(1,S.measures-spanBars+1));
    S.cycleStartBar=newStart;
    S.cycleEndBar=newStart+spanBars-1;
    syncCycleControls();
    render();
    return;
  }
  if(drag.type==='vzoom'){
    const dy=e.clientY-drag.sy;
    noteH=clamp(Math.round(drag.startNoteH+dy*0.3),noteH_MIN,noteH_MAX);
    resize();
    return;
  }
  if(drag.type==='select-box'){
    drag.cx=cx;
    drag.cy=cy;
    drag.moved=drag.moved||Math.abs(drag.cx-drag.sx)>3||Math.abs(drag.cy-drag.sy)>3;
    render();
    return;
  }
  if(drag.type==='drag-group'){
    const beatDelta=normalizeBeat(xToBeat(cx)-drag.sxBeat);
    const noteBase=clamp(yToNote(cy),MIDI_MIN,MIDI_MAX);
    const dragSet=new Set(drag.ids);
    // Check all moves first; if any collide with non-group notes, skip entire move
    let blocked=false;
    for(const id of drag.ids){
      const ev=S.pluck.find(p=>p.id===id);
      const start=drag.startById.get(id);
      const offs=drag.noteOffsets.find(o=>o.id===id);
      if(!ev||!start||!offs)continue;
      const nb=Math.max(0,start.beat+beatDelta);
      const nn=clamp(noteBase+offs.noteOffset,MIDI_MIN,MIDI_MAX);
      for(const other of S.pluck){
        if(dragSet.has(other.id))continue;
        if(notesOverlap(nb,ev.duration_b,nn,parseBeat(other.beat),other.duration_b,other.note)){blocked=true;break;}
      }
      if(blocked)break;
    }
    if(!blocked){
      for(const id of drag.ids){
        const ev=S.pluck.find(p=>p.id===id);
        const start=drag.startById.get(id);
        const offs=drag.noteOffsets.find(o=>o.id===id);
        if(!ev||!start||!offs)continue;
        ev.beat=beatLabel(Math.max(0,start.beat+beatDelta));
        ev.note=clamp(noteBase+offs.noteOffset,MIDI_MIN,MIDI_MAX);
        if(S.selPluck===ev.id)refreshInspNote(ev);
      }
    }
    render();
    return;
  }
  const ev=S.pluck.find(p=>p.id===drag.id);
  if(!ev)return;
  if(drag.type==='drag'){
    const newBeat=normalizeBeat(Math.max(0,xToBeat(cx)+drag.bo));
    const newNote=clamp(yToNote(cy)+drag.no,MIDI_MIN,MIDI_MAX);
    if(!hasCollision(newBeat,ev.duration_b,newNote,ev.id)){
      ev.beat=beatLabel(newBeat);
      ev.note=newNote;
    }
    if(S.selPluck===ev.id)refreshInspNote(ev);
  } else {
    const cursorBeat=normalizeBeat(Math.max(0,xToBeat(cx)));
    const minDur=minDurationBeats();
    if(drag.edge==='left'){
      const newStart=Math.min(cursorBeat,drag.oe-minDur);
      const newDur=trimBeatNumber(Math.max(minDur,drag.oe-newStart));
      if(!hasCollision(newStart,newDur,ev.note,ev.id)){
        ev.beat=beatLabel(newStart);
        ev.duration_b=newDur;
      }
    } else {
      const newEnd=Math.max(cursorBeat,drag.os+minDur);
      const newDur=trimBeatNumber(Math.max(minDur,newEnd-drag.os));
      if(!hasCollision(parseBeat(ev.beat),newDur,ev.note,ev.id)){
        ev.duration_b=newDur;
      }
    }
    if(S.selPluck===ev.id)refreshInspDur(ev);
  }
  render();
});

canvas.addEventListener('pointerleave',()=>{
  canvas.style.cursor=S.editMode==='draw'?'default':'crosshair';
});

canvas.addEventListener('pointerup',()=>{
  if(!drag)return;
  if(drag.type==='midi-curve'){
    syncJSON();
    drag=null;
    render();
    return;
  }
  if(drag.type==='cycle-move'){
    drag=null;
    render();
    return;
  }
  if(drag.type==='select-box'){
    if(!drag.moved&&typeof drag.clickBeat==='number')setPlayheadBeat(drag.clickBeat);
    applySelectionBox(drag);
    drag=null;
    render();
    return;
  }
  syncJSON();
  drag=null;
});

canvas.addEventListener('dblclick',e=>{
  const r=canvas.getBoundingClientRect();
  const cx=e.clientX-r.left;
  const cy=e.clientY-r.top;

  const lane=midiLaneAtY(cy);
  if(cx<LABEL_W&&lane>=0&&lane!==MIDI_GENERAL_LANE_INDEX){
    S.focusedCCLane=(S.focusedCCLane===lane)?null:lane;
    render();
    return;
  }

  if(cx>=LABEL_W&&cy<CHORD_H){
    const b=normalizeBeat(Math.max(0,xToBeat(cx)));
    if(b<totalBeats()){
      addChord(b);
      render();
    }
    return;
  }

  if(S.editMode==='draw')return;
  const myY=CHORD_H+rollH();
  if(cx<LABEL_W||cy<CHORD_H||cy>=myY)return;

  const hit=hitPluck(cx,cy);
  if(hit){rmPluck(hit.id);render();}
});

function applySelectionBox(box){
  if(!box.moved){
    if(box.hitId!==null){
      selPluck(box.hitId);
      return;
    }
    clearPluckSelection();
    return;
  }

  const x1=Math.min(box.sx,box.cx), x2=Math.max(box.sx,box.cx);
  const y1=Math.min(box.sy,box.cy), y2=Math.max(box.sy,box.cy);
  const ids=[];
  for(const ev of S.pluck){
    const x=beatToX(parseBeat(ev.beat));
    const y=noteToY(ev.note);
    const w=Math.max(8,ev.duration_b*S.zoom);
    const nx1=x, nx2=x+w, ny1=y+1, ny2=y+noteH-1;
    const overlaps=!(nx2<x1||nx1>x2||ny2<y1||ny1>y2);
    if(overlaps)ids.push(ev.id);
  }
  if(!ids.length){
    clearPluckSelection();
    return;
  }
  S.selPluckIds=new Set(ids);
  S.selPluck=ids.length===1?ids[0]:null;
  S.selChord=null;
  S.selMidi=null;
  if(ids.length===1){
    const ev=S.pluck.find(e=>e.id===ids[0]);
    if(ev)openInsp(ev);
  } else {
    closeInsp();
  }
}

function chordDown(cx,cy,e){
  if(cx<LABEL_W)return;
  const hit=hitChord(cx,cy);
  if(hit){
    selChord(hit.id);
    showCPop(hit,e.clientX,e.clientY);
    return;
  }

  const cycle=getCycleRange();
  if(cycle){
    const beat=Math.max(0,xToBeat(cx));
    if(beat>=cycle.startBeat&&beat<cycle.endBeat){
      drag={
        type:'cycle-move',
        startBeat:beat,
        startBar:cycle.startBar,
        endBar:cycle.endBar,
      };
      render();
      return;
    }
  }
}
function midiDown(cx,cy,e){
  if(cx<LABEL_W)return;
  const lane=midiLaneAtY(cy);
  if(lane<0)return;
  if(lane!==MIDI_GENERAL_LANE_INDEX){
    const cc=MIDI_AUTOMATION_CCS[lane];
    const beat=normalizeBeat(clamp(xToBeat(cx),0,totalBeats()));
    const value=midiValueFromY(cy,lane);
    upsertMidiCurvePoint(cc,beat,value);
    drag={type:'midi-curve',cc,lane,lastBeat:beat};
    render();
    syncJSON();
    return;
  }
  const hit=hitMidi(cx,cy);
  if(hit){selMidi(hit.id);showMPop(hit,e.clientX,e.clientY)}
  else{const b=normalizeBeat(Math.max(0,xToBeat(cx)));if(b<totalBeats()){addMidi(b);render()}}
}

function hitPluck(cx,cy){
  for(const ev of S.pluck){
    const x=beatToX(parseBeat(ev.beat)),y=noteToY(ev.note),w=Math.max(8,ev.duration_b*S.zoom);
    if(cx>=x&&cx<=x+w&&cy>=y+1&&cy<=y+noteH-1)return ev;
  }return null;
}

function getPluckEdgeHit(cx,cy){
  const hit=hitPluck(cx,cy);
  if(!hit)return null;
  const startX=beatToX(parseBeat(hit.beat));
  const endX=startX+Math.max(8,hit.duration_b*S.zoom);
  if(Math.abs(cx-startX)<=6)return{ev:hit,edge:'left'};
  if(Math.abs(cx-endX)<=6)return{ev:hit,edge:'right'};
  return null;
}

function updateHoverCursor(cx,cy){
  const myY=midiTopY();
  if(cx>=LABEL_W&&cy<CHORD_H){
    const cycle=getCycleRange();
    if(cycle){
      const beat=Math.max(0,xToBeat(cx));
      if(beat>=cycle.startBeat&&beat<cycle.endBeat){
        canvas.style.cursor=drag&&drag.type==='cycle-move'?'grabbing':'grab';
        return;
      }
    }
    canvas.style.cursor='default';
    return;
  }
  if(cx<LABEL_W&&cy>=CHORD_H&&cy<myY){
    canvas.style.cursor='ns-resize';
    return;
  }
  if(cx<LABEL_W||cy<CHORD_H||cy>=myY){
    if(cy>=myY&&cy<myY+MIDI_H){
      const lane=midiLaneAtY(cy);
      canvas.style.cursor=lane>=0&&lane!==MIDI_GENERAL_LANE_INDEX?'crosshair':'default';
      return;
    }
    canvas.style.cursor=S.editMode==='draw'?'default':'crosshair';
    return;
  }
  const edgeHit=getPluckEdgeHit(cx,cy);
  if(edgeHit){
    canvas.style.cursor='ew-resize';
    return;
  }
  canvas.style.cursor=S.editMode==='draw'?'default':'crosshair';
}
function hitChord(cx,cy){
  for(const ev of S.chord){
    const x=beatToX(parseBeat(ev.beat)),fw=Math.max(36,ev.chord.length*8+10);
    if(cx>=x-4&&cx<=x+fw&&cy>=4&&cy<=CHORD_H-4)return ev;
  }return null;
}
function hitMidi(cx,cy){
  if(midiLaneAtY(cy)!==MIDI_GENERAL_LANE_INDEX)return null;
  const cy2=midiLaneTop(MIDI_GENERAL_LANE_INDEX)+midiLaneHeight(MIDI_GENERAL_LANE_INDEX)/2;
  for(const ev of S.midi){
    const x=beatToX(parseBeat(ev.beat));
    if(Math.abs(cx-x)<10&&Math.abs(cy-cy2)<10)return ev;
  }return null;
}

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){
    S.zoom=clamp(S.zoom*(e.deltaY>0?0.88:1.14),18,320);
  } else {
    const maxScroll=Math.max(0,totalBeats()*S.zoom-CW+LABEL_W+80);
    S.scrollX=clamp(S.scrollX+(e.shiftKey?e.deltaY:e.deltaX)*0.8,0,maxScroll);
  }
  render();
},{passive:false});

// ═══════════════════════════════════════════════
// CRUD
// ═══════════════════════════════════════════════
function notesOverlap(startA,durA,noteA,startB,durB,noteB){
  return noteA===noteB&&startA<startB+durB&&startA+durA>startB;
}
function hasCollision(beat,dur,note,excludeId){
  for(const ev of S.pluck){
    if(ev.id===excludeId)continue;
    if(notesOverlap(beat,dur,note,parseBeat(ev.beat),ev.duration_b,ev.note))return true;
  }
  return false;
}
function clampDurationToNext(beat,note,maxDur,excludeId){
  let clamped=maxDur;
  for(const ev of S.pluck){
    if(ev.id===excludeId)continue;
    if(ev.note!==note)continue;
    const s=parseBeat(ev.beat);
    if(s>beat&&s<beat+clamped)clamped=s-beat;
  }
  return clamped;
}
function addNote(b,n){
  const dur=clampDurationToNext(b,n,gridStep(),null);
  if(hasCollision(b,dur,n,null))return null;
  const ev={id:S.nextId++,note:n,duration_b:dur,speed:SPEED_DEFAULT,slide:0,beat:beatLabel(b),string_index:null};
  S.pluck.push(ev); selPluck(ev.id); syncJSON(); return ev;
}
function rmPluck(id){
  S.pluck=S.pluck.filter(e=>e.id!==id);
  S.selPluckIds.delete(id);
  if(S.selPluck===id){S.selPluck=null;closeInsp()}
  syncJSON();
}
function addChord(b){
  const ev={id:S.nextId++,chord:'Em',beat:beatLabel(b)};
  S.chord.push(ev); selChord(ev.id); syncJSON(); return ev;
}
function addMidi(b){
  const ev={id:S.nextId++,address:'/cc',args:[7,64],interp:0,beat:beatLabel(b)};
  S.midi.push(ev); selMidi(ev.id); syncJSON(); return ev;
}

// ═══════════════════════════════════════════════
// SELECTION
// ═══════════════════════════════════════════════
function selPluck(id){
  S.selPluckIds=new Set([id]);
  S.selPluck=id; S.selChord=null; S.selMidi=null;
  const ev=S.pluck.find(e=>e.id===id);
  if(ev)openInsp(ev);
}
function selChord(id){S.selChord=id;S.selPluck=null;S.selMidi=null;closeInsp()}
function selMidi(id){S.selMidi=id;S.selPluck=null;S.selChord=null;closeInsp()}
function clearPluckSelection(){
  S.selPluck=null;
  S.selPluckIds.clear();
  closeInsp();
}
function deselectAll(){S.selPluck=null;S.selPluckIds.clear();S.selChord=null;S.selMidi=null;closeInsp()}

// ═══════════════════════════════════════════════
// INSPECTOR
// ═══════════════════════════════════════════════
function openInsp(ev){
  document.getElementById('insp').classList.add('open');
  refreshInspNote(ev); refreshInspDur(ev);
  document.getElementById('i-speed').value=ev.speed;
  document.getElementById('i-sv').textContent=ev.speed;
  document.getElementById('i-slide').checked=ev.slide===1;
  document.getElementById('i-slide-lbl').textContent=ev.slide?'On':'Off';
  document.getElementById('i-str-ov').value=ev.string_index!==null?ev.string_index:'';
}
function refreshInspNote(ev){
  const s=strOf(ev.note);
  document.getElementById('i-note').textContent=noteName(ev.note);
  document.getElementById('i-note').style.color=s.color;
  document.getElementById('i-midi').textContent=ev.note;
  document.getElementById('i-str').textContent=s.name;
  document.getElementById('i-str').style.color=s.color;
}
function refreshInspDur(ev){
  document.getElementById('i-dur').value=ev.duration_b;
  document.getElementById('i-trem').classList.toggle('on',hasTremolo(ev));
}
function closeInsp(){document.getElementById('insp').classList.remove('open')}

function updSpeed(v){
  const ev=S.pluck.find(e=>e.id===S.selPluck);if(!ev)return;
  ev.speed=clampSpeed(v);
  document.getElementById('i-speed').value=ev.speed;
  document.getElementById('i-sv').textContent=ev.speed;
  syncJSON(); render();
}
function updSlide(c){
  const ev=S.pluck.find(e=>e.id===S.selPluck);if(!ev)return;
  ev.slide=c?1:0;
  document.getElementById('i-slide-lbl').textContent=c?'On':'Off';
  syncJSON(); render();
}
function updDur(v){
  const ev=S.pluck.find(e=>e.id===S.selPluck);if(!ev)return;
  const raw=Math.max(0.0625,parseFloat(v)||0.5);
  const beat=parseBeat(ev.beat);
  ev.duration_b=clampDurationToNext(beat,ev.note,raw,ev.id);
  document.getElementById('i-dur').value=ev.duration_b;
  document.getElementById('i-trem').classList.toggle('on',hasTremolo(ev));
  syncJSON(); render();
}
function updStrOv(v){
  const ev=S.pluck.find(e=>e.id===S.selPluck);if(!ev)return;
  ev.string_index=v===''?null:parseInt(v);
  syncJSON();
}
function delSelNote(){if(S.selPluck!==null){rmPluck(S.selPluck);render()}}

function delSelectedPluckEvents(){
  const ids=S.selPluckIds.size?[...S.selPluckIds]:(S.selPluck!==null?[S.selPluck]:[]);
  if(!ids.length)return false;
  const idSet=new Set(ids);
  S.pluck=S.pluck.filter(ev=>!idSet.has(ev.id));
  S.selPluck=null;
  S.selPluckIds.clear();
  closeInsp();
  syncJSON();
  render();
  return true;
}

// ═══════════════════════════════════════════════
// CHORD POPUP
// ═══════════════════════════════════════════════
function showCPop(ev,px,py){
  const p=document.getElementById('cpop');
  p.style.left=px+'px'; p.style.top=py+'px'; p.classList.add('on');
  document.getElementById('cp-chord').value=ev.chord;
  document.getElementById('cp-beat').value=ev.beat;
  setTimeout(()=>{
    const r=p.getBoundingClientRect();
    if(r.bottom>window.innerHeight)p.style.top=(py-r.height-8)+'px';
    if(r.right>window.innerWidth)p.style.left=(px-r.width)+'px';
  },0);
}
function closeCPop(){document.getElementById('cpop').classList.remove('on')}
function updChord(k,v){
  const ev=S.chord.find(e=>e.id===S.selChord);if(!ev)return;
  ev[k]=v; syncJSON(); render();
}
function delChord(){
  if(S.selChord===null)return;
  S.chord=S.chord.filter(e=>e.id!==S.selChord);
  S.selChord=null; closeCPop(); syncJSON(); render();
}

// ═══════════════════════════════════════════════
// MIDI POPUP
// ═══════════════════════════════════════════════
function showMPop(ev,px,py){
  const p=document.getElementById('mpop');
  p.style.left=px+'px'; p.style.top=py+'px'; p.classList.add('on');
  document.getElementById('mp-addr').value=ev.address;
  document.getElementById('mp-args').value=ev.args.join(', ');
  document.getElementById('mp-interp').checked=ev.interp===1;
  setTimeout(()=>{
    const r=p.getBoundingClientRect();
    if(r.bottom>window.innerHeight)p.style.top=(py-r.height-8)+'px';
    if(r.right>window.innerWidth)p.style.left=(px-r.width)+'px';
  },0);
}
function closeMPop(){document.getElementById('mpop').classList.remove('on')}
function updMidi(k,v){
  const ev=S.midi.find(e=>e.id===S.selMidi);if(!ev)return;
  if(k==='args'){ev.args=v.split(',').map(s=>{const n=parseFloat(s.trim());return isNaN(n)?0:n})}
  else{ev[k]=v}
  syncJSON(); render();
}
function delMidi(){
  if(S.selMidi===null)return;
  S.midi=S.midi.filter(e=>e.id!==S.selMidi);
  S.selMidi=null; closeMPop(); syncJSON(); render();
}

// ═══════════════════════════════════════════════
// TRANSPORT
// ═══════════════════════════════════════════════
const Synth={
  ctx:null,
  master:null,
  active:new Set(),
  async ensure(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.22;
      this.master.connect(this.ctx.destination);
    }
    if(this.ctx.state==='suspended'){
      try{await this.ctx.resume();}catch(_e){}
    }
    return this.ctx.state==='running';
  },
  midiToFreq(m){return 440*Math.pow(2,(m-69)/12)},
  trigger(note,durS=0.2,vel=90){
    if(!this.ctx||!this.master)return;
    const now=this.ctx.currentTime;
    const d=Math.max(0.03,durS);
    const rel=Math.min(0.12,Math.max(0.03,d*0.45));
    const atk=0.005;
    const amp=0.05+Math.min(1,Math.max(0,vel/127))*0.2;

    const osc=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(this.midiToFreq(note),now);

    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(amp,now+atk);
    g.gain.setValueAtTime(amp,now+Math.max(atk,d-rel));
    g.gain.exponentialRampToValueAtTime(0.0001,now+d);

    osc.connect(g); g.connect(this.master);
    osc.start(now);
    osc.stop(now+d+0.01);

    this.active.add(osc);
    osc.onended=()=>{this.active.delete(osc)};
  },
  stopAll(){
    for(const osc of this.active){
      try{osc.stop();}catch(_e){}
    }
    this.active.clear();
  }
};

function triggerPluckEventsBetween(prevBeat,nextBeat){
  if(nextBeat<=prevBeat)return;
  const bps=S.bpm/60;
  for(const ev of S.pluck){
    const eb=parseBeat(ev.beat);
    if(eb>=prevBeat&&eb<nextBeat){
      const durS=(ev.duration_b??0.5)/bps;
      Synth.trigger(ev.note,durS,speedToVelocity(ev.speed));
    }
  }
}

let playIv=null, playT0=null, playB0=0;

function setPlayheadBeat(beat){
  S.playBeat=clamp(normalizeBeat(beat),0,totalBeats());
  const m=bpm(), bar=Math.floor(S.playBeat/m)+1, b=Math.floor(S.playBeat%m)+1;
  document.getElementById('pos').textContent=`${bar}.${b}`;
  if(S.playing){
    playB0=S.playBeat;
    playT0=performance.now();
  }
}

document.getElementById('btn-play').addEventListener('click',()=>{
  if(S.playing)return;
  Synth.ensure();
  const cycleRange=getCycleRange();
  if(cycleRange&&(S.playBeat<cycleRange.startBeat||S.playBeat>=cycleRange.endBeat)){
    setPlayheadBeat(cycleRange.startBeat);
  }
  S.playing=true; playT0=performance.now(); playB0=S.playBeat;
  document.getElementById('btn-play').classList.add('on');
  playIv=setInterval(()=>{
    const prevBeat=S.playBeat;
    const bps=S.bpm/60;
    const elapsed=(performance.now()-playT0)/1000*bps;
    const cycle=getCycleRange();
    if(cycle){
      const len=cycle.endBeat-cycle.startBeat;
      const absoluteBeat=playB0+elapsed;
      const wrapped=cycle.startBeat+((((absoluteBeat-cycle.startBeat)%len)+len)%len);
      if(wrapped<prevBeat){
        triggerPluckEventsBetween(prevBeat,cycle.endBeat);
        triggerPluckEventsBetween(cycle.startBeat,wrapped);
      }else{
        triggerPluckEventsBetween(prevBeat,wrapped);
      }
      S.playBeat=wrapped;
      const m=bpm(), bar=Math.floor(S.playBeat/m)+1, b=Math.floor(S.playBeat%m)+1;
      document.getElementById('pos').textContent=`${bar}.${b}`;
      render();
      return;
    }

    S.playBeat=playB0+elapsed;
    triggerPluckEventsBetween(prevBeat,S.playBeat);
    if(S.playBeat>=totalBeats()){stopPlay();return;}
    const m=bpm(), bar=Math.floor(S.playBeat/m)+1, b=Math.floor(S.playBeat%m)+1;
    document.getElementById('pos').textContent=`${bar}.${b}`;
    render();
  },16);
});

document.getElementById('btn-stop').addEventListener('click',stopPlay);
function stopPlay(){
  S.playing=false; clearInterval(playIv); playIv=null;
  Synth.stopAll();
  S.playBeat=0; document.getElementById('btn-play').classList.remove('on');
  document.getElementById('pos').textContent='1.1'; render();
}

function buildJSON(){
  const tracks=[];
  if(S.chord.length){
    tracks.push({name:"chords_main",type:"chord",
      events:[...S.chord].sort((a,b)=>parseBeat(a.beat)-parseBeat(b.beat))
        .map(e=>({chord:e.chord,beat:e.beat}))});
  }
  if(S.pluck.length){
    tracks.push({name:"pluck_main",type:"pluck",
      events:[...S.pluck].sort((a,b)=>parseBeat(a.beat)-parseBeat(b.beat))
        .map(e=>{
          const o={note:e.note,duration_b:e.duration_b,speed:e.speed,slide:e.slide,beat:e.beat};
          if(e.string_index!==null)o.string_index=e.string_index;
          return o;
        })});
  }
  const combinedMidi=[
    ...S.midi.map(e=>({address:e.address,args:e.args,interp:e.interp,beat:e.beat})),
    ...midiAutomationEvents(),
  ].sort((a,b)=>parseBeat(a.beat)-parseBeat(b.beat));
  if(combinedMidi.length){
    tracks.push({name:"midi_fx",type:"midi",
      events:combinedMidi});
  }
  return{song:{name:S.songName,meta:{key:`${S.keyRoot} ${S.keyMode}`,time_signature:S.timeSig,bpm:S.bpm,tempo_curve:[{time:0.0,bpm:S.bpm}]},tracks}};
}

function hlJSON(s){
  return s
    .replace(/("(?:[^"\\]|\\.)*")\s*:/g,'<span class="jk">$1</span>:')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g,': <span class="js">$1</span>')
    .replace(/:\s*(-?\d+\.?\d*)/g,': <span class="jn">$1</span>')
    .replace(/:\s*(true|false|null)/g,': <span class="jb">$1</span>');
}

function buildUploadJSON(){
  const full=buildJSON();
  const cycle=getCycleRange();
  if(!cycle)return full;

  const {startBeat,endBeat}=cycle;
  const spb=secondsPerBeat();
  const toTimestamp=beat=>1+Math.max(0,(beat-startBeat))*spb;
  const eventBeat=ev=>{
    if(ev&&ev.beat!==undefined&&ev.beat!==null&&String(ev.beat).trim()!=='')return parseBeat(ev.beat);
    if(ev&&ev.timestamp!==undefined&&ev.timestamp!==null)return secondsToBeat(ev.timestamp);
    return 0;
  };

  const tracks=(full.song.tracks||[]).map(track=>{
    const events=(track.events||[])
      .filter(ev=>{
        const beat=eventBeat(ev);
        return beat>=startBeat&&beat<endBeat;
      })
      .map(ev=>{
        const beat=eventBeat(ev);
        if(track.type==='pluck'){
          const durationBeats=(ev.duration_b!==undefined&&ev.duration_b!==null)
            ? (parseFloat(ev.duration_b)||0.5)
            : ((ev.duration_s!==undefined&&ev.duration_s!==null)
                ? secondsToDurationBeats(ev.duration_s)
                : (parseFloat(ev.duration)||0.5));
          const out={
            note:ev.note,
            duration_s:durationBeats*spb,
            speed:ev.speed,
            slide:ev.slide,
            timestamp:toTimestamp(beat),
          };
          if(ev.string_index!==undefined&&ev.string_index!==null)out.string_index=ev.string_index;
          return out;
        }
        if(track.type==='chord'){
          return {chord:ev.chord,timestamp:toTimestamp(beat)};
        }
        if(track.type==='midi'){
          return {address:ev.address,args:ev.args,interp:ev.interp,timestamp:toTimestamp(beat)};
        }
        return ev;
      });
    return {...track,events};
  });

  return {
    song:{
      ...full.song,
      tracks,
    },
  };
}

function loadJSON(data){
  const song=data.song; if(!song)return alert('Missing "song" key');
  S.songName=song.name||'Imported';
  document.getElementById('song-name').value=S.songName;
  if(song.meta){
    const m=song.meta;
    if(m.bpm){S.bpm=m.bpm;document.getElementById('bpm').value=m.bpm}
    if(m.key){const p=m.key.split(' ');S.keyRoot=p[0]||'E';S.keyMode=p[1]||'minor';
      document.getElementById('key-root').value=S.keyRoot;
      document.getElementById('key-mode').value=S.keyMode}
    if(m.time_signature){S.timeSig=m.time_signature;document.getElementById('time-sig').value=S.timeSig}
  }
  S.pluck=[]; S.chord=[]; S.midi=[]; S.midiCurves=createEmptyMidiCurves(); S.focusedCCLane=null; S.nextId=1;
  S.selPluck=null; S.selPluckIds.clear(); S.selChord=null; S.selMidi=null; closeInsp();
  let maxB=0;
  (song.tracks||[]).forEach(tr=>{
    (tr.events||[]).forEach(ev=>{
      const hasBeat=ev.beat!==undefined&&ev.beat!==null&&String(ev.beat).trim()!=='';
      const hasTimestamp=Number.isFinite(parseFloat(ev.timestamp));
      const b=hasBeat?parseBeat(ev.beat):(hasTimestamp?secondsToBeat(ev.timestamp):0);
      maxB=Math.max(maxB,b);
      if(tr.type==='pluck'){
        const durationBeats=(ev.duration_b!==undefined&&ev.duration_b!==null)
          ? (parseFloat(ev.duration_b)||0.5)
          : ((ev.duration_s!==undefined&&ev.duration_s!==null)
              ? secondsToDurationBeats(ev.duration_s)
              : (parseFloat(ev.duration)||0.5));
        S.pluck.push({id:S.nextId++,note:ev.note||52,
          duration_b:durationBeats,
          speed:normalizeImportedSpeed(ev.speed),slide:ev.slide??0,
          beat:hasBeat?ev.beat:beatLabel(b),
          string_index:ev.string_index??null});
      } else if(tr.type==='chord'){
        S.chord.push({id:S.nextId++,chord:ev.chord||'Em',beat:hasBeat?ev.beat:beatLabel(b)});
      } else if(tr.type==='midi'){
        const address=ev.address||'/cc';
        const args=Array.isArray(ev.args)?ev.args:[];
        const cc=args.length?parseInt(args[0],10):NaN;
        const value=args.length>1?parseFloat(args[1]):0;
        if(address==='/cc'&&MIDI_AUTOMATION_CCS.includes(cc)){
          upsertMidiCurvePoint(cc,b,clamp(Math.round(Number.isFinite(value)?value:0),0,127));
        } else {
          S.midi.push({id:S.nextId++,address,args,interp:ev.interp??0,beat:hasBeat?ev.beat:beatLabel(b)});
        }
      }
    });
  });
  const m=bpm();
  S.measures=Math.max(8,Math.ceil(maxB/m)+2);
  document.getElementById('measures').value=S.measures;
  syncCycleControls();
  render(); syncJSON();
}

function getSelectedPluckEvents(){
  const ids=S.selPluckIds.size?[...S.selPluckIds]:(S.selPluck!==null?[S.selPluck]:[]);
  if(!ids.length)return [];
  const idSet=new Set(ids);
  return S.pluck.filter(ev=>idSet.has(ev.id));
}

function copySelectedPluckEvents(){
  const selected=getSelectedPluckEvents();
  if(!selected.length)return false;
  const events=selected
    .map(ev=>({
      beat:parseBeat(ev.beat),
      note:ev.note,
      duration_b:ev.duration_b,
      speed:ev.speed,
      slide:ev.slide,
      string_index:ev.string_index,
    }))
    .sort((a,b)=>a.beat-b.beat||a.note-b.note);

  const originBeat=Math.min(...events.map(e=>e.beat));
  const originNote=Math.min(...events.map(e=>e.note));
  S.clipboardPluck={originBeat,originNote,events};
  return true;
}

function pastePluckEvents(){
  const clip=S.clipboardPluck;
  if(!clip||!clip.events||!clip.events.length)return false;
  const targetBeat=S.pasteAnchor?S.pasteAnchor.beat:(clip.originBeat+1);
  const created=[];

  for(const src of clip.events){
    const b=targetBeat+(src.beat-clip.originBeat);
    if(b<0||b>=totalBeats())continue;
    const n=clamp(src.note,MIDI_MIN,MIDI_MAX);
    const ev={
      id:S.nextId++,
      note:n,
      duration_b:src.duration_b,
      speed:src.speed,
      slide:src.slide,
      beat:beatLabel(normalizeBeat(b)),
      string_index:src.string_index,
    };
    S.pluck.push(ev);
    created.push(ev.id);
  }

  if(!created.length)return false;
  S.selPluckIds=new Set(created);
  S.selPluck=created.length===1?created[0]:null;
  S.selChord=null;
  S.selMidi=null;
  if(created.length===1){
    const ev=S.pluck.find(e=>e.id===created[0]);
    if(ev)openInsp(ev);
  } else {
    closeInsp();
  }
  syncJSON();
  render();
  return true;
}

document.addEventListener('keydown',e=>{
  const tag=document.activeElement?.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;

  const k=e.key.toLowerCase();
  if(e.key==='Escape'&&hasFocusedCCLane()){
    S.focusedCCLane=null;
    render();
    return;
  }
  if(k==='b'){setEditMode(S.editMode==='draw'?'select':'draw');render();return;}
  if((e.ctrlKey||e.metaKey)&&k==='a'){
    e.preventDefault();
    if(!S.pluck.length)return;
    S.selPluckIds=new Set(S.pluck.map(ev=>ev.id));
    S.selPluck=null;
    S.selChord=null;
    S.selMidi=null;
    closeInsp();
    render();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&k==='c'){
    if(copySelectedPluckEvents())e.preventDefault();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&k==='v'){
    if(pastePluckEvents())e.preventDefault();
    return;
  }

  if(e.key!=='Delete'&&e.key!=='Backspace')return;
  if(delSelectedPluckEvents())return;
  if(S.selPluck!==null){delSelNote();render()}
  else if(S.selChord!==null){delChord()}
  else if(S.selMidi!==null){delMidi()}
});

  ];
  S.midi=[
    {id:S.nextId++,address:"/cc",args:[7,30],interp:1,beat:"1.1"},
    {id:S.nextId++,address:"/cc",args:[7,100],interp:0,beat:"3.1"},
  ];
}

function applyStartupMode(){
  const mode=(new URLSearchParams(window.location.search).get('startup')||'example').toLowerCase();
  if(mode==='new'){
    applyNewProject();
    return;
  }
  if(mode==='import'){
    const raw=localStorage.getItem(IMPORT_KEY);
    if(raw){
      try{
        loadJSON(JSON.parse(raw));
        localStorage.removeItem(IMPORT_KEY);
        return;
      }catch(_e){
        localStorage.removeItem(IMPORT_KEY);
      }
    }
    applyNewProject();
    return;
  }
  applyExampleProject();
}

function init(){
  resize();
  window.addEventListener('resize',resize);
  applyStartupMode();
  render();
  syncJSON();
}
init();
</script>
